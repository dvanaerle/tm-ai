<!-- PROTOTYPE: throwaway, not production code -->

<!-- Variant registry: one entry per variant, in switcher order. The switcher reads it. -->
<script type="application/json" id="prototype-variants">
[
  { "key": "A", "name": "VARIANT_NAME", "tradeoff": "VARIANT_TRADEOFF" }
]
</script>

<!-- ===== Page frame: one green bar, h-15 with the logo at h-11 at every breakpoint. Shared by every variant; keep it.
     Only for a question about the header, menu or footer: swap it for the full shell in page-shell.html. ===== -->
<header class="bg-header">
    <div class="container flex items-center justify-center lg:justify-start h-15">
        <a href="#" aria-label="Tuinmaximaal, naar de startpagina">
            LOGO_SVG
        </a>
    </div>
</header>

<main class="pb-28">
    <!-- VARIANTS: one <section data-variant="KEY"> per registry entry. Only the active one is shown.
         Don't put display classes on the section itself; wrap the variant's layout in a child element. -->
    <section data-variant="A">
        <!-- Variant A -->
    </section>
</main>

<!-- ===== Prototype switcher: prototype chrome, not part of the design. Keep it as is. ===== -->
<div id="prototype-switcher" class="fixed inset-x-4 bottom-4 z-50 mx-auto w-fit max-w-full flex items-center gap-2 rounded-full bg-gray-900 text-white shadow-arrow p-1.5 font-body">
    <button type="button" data-step="-1" class="flex items-center justify-center size-11 shrink-0 rounded-full hover:bg-gray-800 focus:outline-none focus-visible:ring-4 focus-visible:ring-gray-200" aria-label="Vorige variant">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <div class="min-w-0 px-2 text-center" aria-live="polite">
        <p data-label class="text-3.5 font-semibold"></p>
        <p data-tradeoff class="text-3 text-gray-200 line-clamp-2 md:line-clamp-none"></p>
    </div>
    <button type="button" data-step="1" class="flex items-center justify-center size-11 shrink-0 rounded-full hover:bg-gray-800 focus:outline-none focus-visible:ring-4 focus-visible:ring-gray-200" aria-label="Volgende variant">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
    </button>
</div>
<script>
(() => {
    const variants = JSON.parse(document.getElementById('prototype-variants').textContent);
    const bar = document.getElementById('prototype-switcher');
    const rule = document.head.appendChild(document.createElement('style'));
    const readParam = () => {
        try { return new URL(location.href).searchParams.get('variant'); } catch { return null; }
    };
    let current = Math.max(0, variants.findIndex((v) => v.key === (readParam() || '').toUpperCase()));

    // Works for static sections and for sections a React root renders later.
    function show(index, updateUrl) {
        current = (index + variants.length) % variants.length;
        const { key, name, tradeoff } = variants[current];
        rule.textContent = `[data-variant]:not([data-variant="${key}"]) { display: none !important; }`;
        bar.querySelector('[data-label]').textContent = `${key} (${name})`;
        bar.querySelector('[data-tradeoff]').textContent = tradeoff;
        if (!updateUrl) return;
        try {
            const url = new URL(location.href);
            url.searchParams.set('variant', key);
            history.replaceState(null, '', url);
        } catch { /* sandboxed artifact: keep the variant in memory */ }
    }

    bar.querySelectorAll('[data-step]').forEach((button) => {
        button.addEventListener('click', () => show(current + Number(button.dataset.step), true));
    });
    document.addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        if (document.querySelector('dialog[open]')) return;
        if (event.target.closest?.('input, textarea, select, [contenteditable]:not([contenteditable="false"])')) return;
        event.preventDefault();
        show(current + (event.key === 'ArrowRight' ? 1 : -1), true);
    });
    show(current, false);
})();
// Dialogs (components/dialogs.md): a button with data-dialog-open="id" opens that dialog as a modal; a button in its
// form method="dialog" closes it; a click on a pop-up's backdrop closes the pop-up.
document.addEventListener('click', (event) => {
    const opener = event.target.closest?.('[data-dialog-open]');
    if (opener) document.getElementById(opener.dataset.dialogOpen)?.showModal();
    if (event.target.matches?.('dialog.popup[open]')) event.target.close();
});
// Dropdowns (components/forms.md → Dropdown): a [data-dropdown] holds a combobox button and its listbox. A click, Enter,
// Space or an arrow key opens it; the arrows, Home and End move through the options; Enter or Space picks one, which is
// copied into the button and announced as a bubbling `dropdown-change` event; Esc, Tab or a click outside closes it.
(() => {
    let ids = 0;
    const parts = (dropdown) => [dropdown.querySelector('.dropdown-button'), dropdown.querySelector('.dropdown-list')];
    const enabled = (list) => [...list.querySelectorAll('[role="option"]:not([aria-disabled="true"])')];
    const activate = (dropdown, option) => {
        const [button, list] = parts(dropdown);
        list.querySelectorAll('.--active').forEach((item) => item.classList.remove('--active'));
        if (!option) return button.removeAttribute('aria-activedescendant');
        option.id ||= `dropdown-option-${++ids}`;
        option.classList.add('--active');
        button.setAttribute('aria-activedescendant', option.id);
        option.scrollIntoView({ block: 'nearest' });
    };
    const toggle = (dropdown, open, byKeyboard) => {
        const [button, list] = parts(dropdown);
        button.setAttribute('aria-expanded', String(open));
        list.hidden = !open;
        const selected = list.querySelector('[aria-selected="true"]:not([aria-disabled="true"])');
        activate(dropdown, open && byKeyboard ? selected ?? enabled(list)[0] : null);
    };
    const pick = (dropdown, option) => {
        const [button, list] = parts(dropdown);
        list.querySelectorAll('[role="option"]').forEach((item) => item.setAttribute('aria-selected', String(item === option)));
        button.innerHTML = option.innerHTML;
        toggle(dropdown, false);
        button.focus();
        dropdown.dispatchEvent(new CustomEvent('dropdown-change', { bubbles: true, detail: { value: option.dataset.value ?? option.textContent.trim() } }));
    };
    document.addEventListener('click', (event) => {
        const dropdown = event.target.closest?.('[data-dropdown]');
        document.querySelectorAll('[data-dropdown]').forEach((other) => {
            if (other !== dropdown && parts(other)[0]?.getAttribute('aria-expanded') === 'true') toggle(other, false);
        });
        if (!dropdown) return;
        const option = event.target.closest('[role="option"]');
        if (option) return option.getAttribute('aria-disabled') === 'true' || pick(dropdown, option);
        const [button] = parts(dropdown);
        if (event.target.closest('.dropdown-button') && !button.disabled) toggle(dropdown, button.getAttribute('aria-expanded') !== 'true', event.detail === 0);
    });
    document.addEventListener('keydown', (event) => {
        const button = event.target.closest?.('[data-dropdown] .dropdown-button');
        if (!button) return;
        const dropdown = button.closest('[data-dropdown]');
        const [, list] = parts(dropdown);
        const options = enabled(list);
        const active = list.querySelector('.--active');
        const index = options.indexOf(active);
        if (button.getAttribute('aria-expanded') !== 'true') {
            if (!['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(event.key)) return;
            event.preventDefault();
            return toggle(dropdown, true, true);
        }
        const next = { ArrowDown: Math.min(index + 1, options.length - 1), ArrowUp: Math.max(index - 1, 0), Home: 0, End: options.length - 1 }[event.key];
        if (next !== undefined) {
            event.preventDefault();
            activate(dropdown, options[next]);
        } else if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            active ? pick(dropdown, active) : toggle(dropdown, false);
        } else if (event.key === 'Escape' || event.key === 'Tab') {
            if (event.key === 'Escape') event.preventDefault();
            toggle(dropdown, false);
        }
    });
    // A prevented Space keydown still clicks a button on keyup; the keydown above has handled it
    document.addEventListener('keyup', (event) => {
        if (event.key === ' ' && event.target.closest?.('[data-dropdown] .dropdown-button')) event.preventDefault();
    });
})();
// Action menus (components/action-menu.md): a [data-menu] holds a button with aria-haspopup="menu" and its
// [role="menu"]. A click opens it; Enter, Space or ArrowDown opens it on the first item; the arrows, Home and End move;
// an item's click, Esc or a click outside closes it and returns focus to the button; Tab closes it.
(() => {
    const parts = (wrap) => [wrap.querySelector('[aria-haspopup="menu"]'), wrap.querySelector('[role="menu"]')];
    const items = (menu) => [...menu.querySelectorAll('[role="menuitem"]:not([aria-disabled="true"], :disabled)')];
    const toggle = (wrap, open, focusFirst) => {
        const [button, menu] = parts(wrap);
        button.setAttribute('aria-expanded', String(open));
        menu.hidden = !open;
        if (open && focusFirst) items(menu)[0]?.focus();
    };
    document.addEventListener('click', (event) => {
        const wrap = event.target.closest?.('[data-menu]');
        document.querySelectorAll('[data-menu]').forEach((other) => {
            if (other !== wrap && parts(other)[0]?.getAttribute('aria-expanded') === 'true') toggle(other, false);
        });
        if (!wrap) return;
        const [button] = parts(wrap);
        if (event.target.closest('[role="menuitem"]')) {
            toggle(wrap, false);
            return button.focus();
        }
        if (event.target.closest('[aria-haspopup="menu"]')) toggle(wrap, button.getAttribute('aria-expanded') !== 'true', event.detail === 0);
    });
    document.addEventListener('keydown', (event) => {
        const wrap = event.target.closest?.('[data-menu]');
        if (!wrap) return;
        const [button, menu] = parts(wrap);
        if (event.target === button) {
            if (!['ArrowDown', 'Enter', ' '].includes(event.key)) return;
            event.preventDefault();
            return toggle(wrap, true, true);
        }
        if (button.getAttribute('aria-expanded') !== 'true') return;
        const list = items(menu);
        const index = list.indexOf(document.activeElement);
        const next = { ArrowDown: (index + 1) % list.length, ArrowUp: (index - 1 + list.length) % list.length, Home: 0, End: list.length - 1 }[event.key];
        if (next !== undefined) {
            event.preventDefault();
            list[next].focus();
        } else if (event.key === 'Escape') {
            event.preventDefault();
            toggle(wrap, false);
            button.focus();
        } else if (event.key === 'Tab') {
            toggle(wrap, false);
        }
    });
    document.addEventListener('keyup', (event) => {
        if (event.key === ' ' && event.target.closest?.('[data-menu] [aria-haspopup="menu"]')) event.preventDefault();
    });
})();
// Quantity selectors (components/choices.md → Quantity): the first button lowers the number input, the last raises it,
// within its min (default 0) and max; a change fires the input's `change` event.
document.addEventListener('click', (event) => {
    const button = event.target.closest?.('.quantity > button');
    const input = button?.parentElement.querySelector('input');
    if (!input || button.disabled) return;
    const step = button === button.parentElement.firstElementChild ? -1 : 1;
    const min = input.min === '' ? 0 : Number(input.min);
    const max = input.max === '' ? Infinity : Number(input.max);
    const value = Math.min(max, Math.max(min, (Number(input.value) || 0) + step));
    if (value === Number(input.value)) return;
    input.value = value;
    input.dispatchEvent(new Event('change', { bubbles: true }));
});
// Load lazy images at once, also those a script adds later: automated screenshots don't scroll, so lazy ones stay blank.
(() => {
    const eager = (root) => root.querySelectorAll?.('img[loading="lazy"]').forEach((img) => { img.loading = 'eager'; });
    eager(document);
    new MutationObserver((records) => records.forEach((record) => record.addedNodes.forEach((node) => {
        if (node.nodeType !== 1) return;
        if (node.matches('img[loading="lazy"]')) node.loading = 'eager';
        eager(node);
    }))).observe(document.body, { childList: true, subtree: true });
})();
</script>
